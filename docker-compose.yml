services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-release-notifier-app
    restart: unless-stopped
    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/github_notifier
      REDIS_URL: redis://redis:6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    volumes:
      - .:/app
      - /app/node_modules

    command: sh -c "npm install && npm run migrate && npm run dev"

  db:
    image: postgres:16-alpine
    container_name: github-release-notifier-db
    restart: unless-stopped
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: github_notifier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d github_notifier"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: github-release-notifier-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
